<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer subtle ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#6366F1" stroke-width="6" opacity="0.3" />

  <!-- Central Judicial Scale Graphic -->
  <!-- Center Column -->
  <rect x="246" y="130" width="20" height="240" rx="10" fill="#FFFFFF" opacity="0.95" />
  <!-- Base -->
  <rect x="176" y="360" width="160" height="24" rx="12" fill="#FFFFFF" opacity="0.95" />
  <!-- Top Balance Beam -->
  <rect x="136" y="150" width="240" height="16" rx="8" fill="#FFFFFF" opacity="0.95" />
  <!-- Center Pivot -->
  <circle cx="256" cy="140" r="16" fill="url(#goldGrad)" />
  
  <!-- Left Scale strings and bowl -->
  <line x1="160" y1="166" x2="130" y2="230" stroke="#E0E7FF" stroke-width="4" />
  <line x1="160" y1="166" x2="190" y2="230" stroke="#E0E7FF" stroke-width="4" />
  <path d="M 110 230 Q 160 270 210 230 Z" fill="url(#goldGrad)" />

  <!-- Right Scale strings and bowl -->
  <line x1="352" y1="166" x2="322" y2="230" stroke="#E0E7FF" stroke-width="4" />
  <line x1="352" y1="166" x2="382" y2="230" stroke="#E0E7FF" stroke-width="4" />
  <path d="M 302 230 Q 352 270 402 230 Z" fill="url(#goldGrad)" />

  <!-- Semaphore lights at bottom -->
  <g transform="translate(186, 410)">
    <rect x="0" y="0" width="140" height="48" rx="24" fill="#1E1B4B" opacity="0.8" />
    <circle cx="28" cy="24" r="14" fill="#22C55E" />
    <circle cx="70" cy="24" r="14" fill="#EAB308" />
    <circle cx="112" cy="24" r="14" fill="#EF4444" />
  </g>
</svg>
